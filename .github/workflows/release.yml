name: Create release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - inc/init.php

permissions:
  contents: write

concurrency:
  group: ketarinweb-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create tag, archives and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n "s/^const KW_VERSION = '\([^']*\)';$/\1/p" inc/init.php)"
          if [[ ! "$version" =~ ^[0-9]{4}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "Invalid KW_VERSION: $version" >&2
            exit 1
          fi
          tag="v$version"

          release_exists=false
          if gh release view "$tag" >/dev/null 2>&1; then
            release_exists=true
          fi

          if ! git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "KetarinWeb $version"
            git push origin "$tag"
          fi

          archive_prefix="ketarinweb-$version/"
          git archive --format=zip --prefix="$archive_prefix" -o "ketarinweb-$version.zip" "$tag"
          git archive --format=tar --prefix="$archive_prefix" "$tag" | gzip -9 > "ketarinweb-$version.tar.gz"

          if [[ "$release_exists" == true ]]; then
            gh release upload "$tag" \
              "ketarinweb-$version.zip" \
              "ketarinweb-$version.tar.gz" \
              --clobber
          else
            gh release create "$tag" \
              "ketarinweb-$version.zip" \
              "ketarinweb-$version.tar.gz" \
              --title "KetarinWeb $version" \
              --generate-notes
          fi
