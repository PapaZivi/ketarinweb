name: Create release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - inc/init.php

permissions:
  contents: write

concurrency:
  group: ketarinweb-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag, archives and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n "s/^const KW_VERSION = '\([^']*\)';$/\1/p" inc/init.php)"
          if [[ ! "$version" =~ ^[0-9]{4}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "Invalid KW_VERSION: $version" >&2
            exit 1
          fi

          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists."
            exit 0
          fi

          if ! git rev-parse --verify --quiet "refs/tags/$version" >/dev/null; then
            git tag -a "$version" -m "KetarinWeb $version"
            git push origin "$version"
          fi

          archive_prefix="ketarinweb-$version/"
          git archive --format=zip --prefix="$archive_prefix" -o "ketarinweb-$version.zip" "$version"
          git archive --format=tar --prefix="$archive_prefix" "$version" | gzip -9 > "ketarinweb-$version.tar.gz"

          gh release create "$version" \
            "ketarinweb-$version.zip" \
            "ketarinweb-$version.tar.gz" \
            --title "KetarinWeb $version" \
            --generate-notes
